# Vikat internal sales assistant — Cloudflare Worker
#
# AUDIENCE: Vikat employees only. This Worker serves material that is not
# cleared for customers. It must sit behind Cloudflare Access (or equivalent)
# and must never be reachable anonymously. See AUTH_MODE below.
#
# Secrets are NOT set here. Run:
#   wrangler secret put ANTHROPIC_API_KEY
# and, depending on LEAD_SINK:
#   wrangler secret put LEAD_WEBHOOK_TOKEN     # LEAD_SINK = "webhook"
#   wrangler secret put DKIM_PRIVATE_KEY       # LEAD_SINK = "mailchannels"
#   wrangler secret put MAILCHANNELS_API_KEY

name = "vikat-sales-assistant"
main = "src/index.js"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

# Served on the free workers.dev subdomain:
#   https://vikat-sales-assistant.<your-account>.workers.dev
#
# No custom domain and no Cloudflare-managed zone are required. Protect it in
# Zero Trust > Access > Applications > Add an application > Self-hosted, then
# "+ Add Workers" and pick this Worker by name. Access attaches to the Worker
# itself, so the workers.dev URL and any future custom domain are both covered.
#
# Without that Access application, AUTH_MODE=cf-access rejects every request
# (it fails closed), so the tool is unusable rather than exposed.
workers_dev = true

# If vikat.ai later moves onto Cloudflare, swap the line above for a route and
# nothing else changes — Access follows the Worker, not the hostname:
#   routes = [{ pattern = "sales-assistant.vikat.ai/*", zone_name = "vikat.ai" }]

# The admin panel and the assistant page are served by this same Worker, so
# there is one origin, one Access policy and no cross-origin requests at all.
[assets]
directory = "../widget"
# Static files win for paths that match a file; everything else (/chat,
# /admin/*, /health, /whoami) falls through to src/index.js.
not_found_handling = "none"

[observability]
enabled = true

# Every value here overrides the same-named key in src/config.js.
[vars]
MODEL = "claude-sonnet-4-6"
MAX_TOKENS = "2048"
MAX_MESSAGES_PER_SESSION = "100"
MAX_CHARS_PER_MESSAGE = "8000"
RATE_LIMIT_REQUESTS = "120"
RATE_LIMIT_WINDOW_SECONDS = "600"

# --- Authentication -------------------------------------------------------
AUTH_MODE = "cf-access"
# From Zero Trust > Settings > Custom Pages, or your team domain.
CF_ACCESS_TEAM_DOMAIN = "sparkling-hat-8db3.cloudflareaccess.com"
# Application Audience (AUD) tag from the Access application's Overview tab.
CF_ACCESS_AUD = "ac7c78ef971056857ecde19e25763644844741c36cb227ee7dbc85910777c759"
ALLOWED_EMAIL_DOMAINS = "vikat.ai"
# Never set ALLOW_DEV_AUTH in this block. It exists only under [env.dev].

# --- Authorization --------------------------------------------------------
# Always admin, whatever storage says. Keep at least one: with an empty KV
# nobody could otherwise reach the admin panel to grant the first role, and a
# botched grant is recoverable by redeploying rather than by editing KV.
BOOTSTRAP_ADMINS = "vinil@vikat.ai"
# Role for someone the IdP authenticated but nobody has graded.
#   rep    — anyone who can sign in can use the assistant (SSO is the gate)
#   denied — explicit allowlist; every user must be granted a role first
DEFAULT_ROLE = "rep"

# --- Origins --------------------------------------------------------------
# The panel and assistant are same-origin with the API, so a browser sends no
# Origin header and this list is not consulted. Kept for local dev and for a
# future separate front end.
ALLOWED_ORIGINS = "http://localhost:8787"

# --- Notifications --------------------------------------------------------
# A Teams or Slack incoming webhook is usually the best fit for an internal
# tool: logged prospects, expert requests and content gaps land in a channel
# the team already watches.
LEAD_SINK = "none"
LEAD_WEBHOOK_URL = ""
LEAD_TO_EMAIL = "sales@vikat.ai"
LEAD_FROM_EMAIL = "agent@vikat.ai"
CONTENT_OWNER_EMAIL = "marketing@vikat.ai"
CONTACT_EMAIL = "sales@vikat.ai"
INTERNAL_HELP_CHANNEL = "#sales-help"

# Create with:
#   wrangler kv namespace create VIKAT_KV
#   wrangler kv namespace create VIKAT_KV --preview
# then paste the ids below.
[[kv_namespaces]]
binding = "VIKAT_KV"
id = "bce1a840e1d348e09c15a00ad28c999d"
preview_id = "37e406bcaf74401b93274d4dde598aa7"

# --- Local development ----------------------------------------------------
# `wrangler dev --env dev` bypasses SSO with a fixed identity. Both flags are
# required, so a stray AUTH_MODE change alone cannot open the door.
[env.dev]
# Named environments do NOT inherit kv_namespaces from the top level, so the
# binding has to be repeated here or `wrangler dev --env dev` fails on the
# first storage call. `--local` uses an on-disk simulator, so the id below is
# only a placeholder and never touches the real namespace.
[[env.dev.kv_namespaces]]
binding = "VIKAT_KV"
id = "local-dev-placeholder"
preview_id = "local-dev-placeholder"

[env.dev.vars]
AUTH_MODE = "dev"
ALLOW_DEV_AUTH = "true"
BOOTSTRAP_ADMINS = "dev@vikat.ai"
ALLOWED_ORIGINS = "http://localhost:8788,http://127.0.0.1:8788"
LEAD_SINK = "none"
INTERNAL_HELP_CHANNEL = "#sales-help"
