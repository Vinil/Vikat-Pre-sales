<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sales Assistant — Vikat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./vikat-chat.css">

<style>
  :root {
    --bg: #050507;
    --sf: #111318;
    --sf2: #171a21;
    --w: #f2f4fa;
    --w80: rgba(242,244,250,.8);
    --w60: rgba(242,244,250,.6);
    --w40: rgba(242,244,250,.4);
    --w20: rgba(242,244,250,.2);
    --w08: rgba(242,244,250,.08);
    --w04: rgba(242,244,250,.04);
    --cyan: #00d4ff;
    --violet: #6e56ff;
    --green: #00e68a;
    --orange: #ff7a45;
    --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  /* The app owns the viewport: the chat is the product, so it gets the room.
     Nothing scrolls at the page level — only the panes inside do. */
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--w);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ─────────────────────────────────────────────── */

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(16px, 4vw, 40px);
    padding: 0 clamp(14px, 2.5vw, 28px);
    height: 56px;
    border-bottom: 1px solid var(--w08);
    background: rgba(5,5,7,.96);
  }

  .logo { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
  .logo-m {
    display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    color: var(--bg); font-weight: 700; font-size: 13px;
  }
  .logo-t { font-weight: 600; font-size: 16px; letter-spacing: -.3px; }
  .logo-t i { font-style: normal; color: var(--cyan); }

  nav { display: flex; gap: 2px; flex: 1 1 auto; }
  .tab {
    padding: 7px 14px; border: none; border-radius: 8px; background: none; cursor: pointer;
    color: var(--w40); font-family: inherit; font-size: 13.5px; font-weight: 500;
    transition: color .2s, background .2s;
  }
  .tab:hover { color: var(--w80); background: var(--w04); }
  .tab[aria-selected="true"] { color: var(--w); background: var(--w08); }

  .who {
    flex: 0 0 auto; font-family: var(--mono); font-size: 10px;
    letter-spacing: .5px; text-transform: uppercase; color: var(--w40);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw;
  }

  /* ── Panes ──────────────────────────────────────────────── */

  main { flex: 1 1 auto; min-height: 0; position: relative; }

  .pane { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .pane[hidden] { display: none; }

  /* Chat pane: three columns, the conversation in the middle.
     The rails collapse to a spine rather than disappearing, so the way back is
     always on screen — a control that vanishes when you use it is a control
     people stop using. */
  #pane-chat {
    padding: 0;
    display: grid;
    grid-template-columns: var(--rail-l, 232px) minmax(0, 1fr) var(--rail-r, 260px);
    align-items: stretch;
  }
  #pane-chat.l-shut { --rail-l: 40px; }
  #pane-chat.r-shut { --rail-r: 40px; }

  .rail {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: rgba(242, 244, 250, 0.015);
  }
  .rail-l { border-right: 1px solid var(--w08); }
  .rail-r { border-left: 1px solid var(--w08); }

  .rail-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 8px 10px 12px;
    min-height: 44px;
    border-bottom: 1px solid var(--w08);
  }
  .rail-r .rail-head { padding: 10px 12px 10px 8px; }

  .rail-tog {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1 1 auto;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    color: var(--w60);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .rail-tog:hover { color: var(--w); }
  .rail-r .rail-tog { flex-direction: row-reverse; }

  .rail-chev {
    flex: none;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(135deg);
    transition: transform 0.15s ease;
  }
  .rail-r .rail-chev { transform: rotate(-45deg); }
  .l-shut .rail-l .rail-chev { transform: rotate(-45deg); }
  .r-shut .rail-r .rail-chev { transform: rotate(135deg); }

  .rail-act {
    flex: none;
    padding: 3px 9px;
    border: 1px solid var(--w20);
    border-radius: 999px;
    background: none;
    color: var(--w80);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .rail-act:hover { border-color: var(--cyan); color: var(--cyan); }

  .rail-count { flex: none; font-size: 11px; color: var(--w40); }

  .rail-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px; }

  /* Collapsed: the head stays, everything else goes. The label is dropped
     rather than rotated — vertical text at 11px is decoration, not a label. */
  .l-shut .rail-l .rail-body,
  .l-shut .rail-l .rail-name,
  .l-shut .rail-l .rail-act,
  .r-shut .rail-r .rail-body,
  .r-shut .rail-r .rail-name,
  .r-shut .rail-r .rail-count { display: none; }
  .l-shut .rail-l .rail-head,
  .r-shut .rail-r .rail-head { padding: 10px 0; justify-content: center; }
  .l-shut .rail-l .rail-tog,
  .r-shut .rail-r .rail-tog { flex: none; justify-content: center; }

  .rail-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    margin-bottom: 2px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--w80);
    font: inherit;
    font-size: 13px;
    line-height: 1.35;
    cursor: pointer;
  }
  .rail-item:hover { background: var(--w04); color: var(--w); }
  .rail-item[aria-current="true"] { background: var(--w08); color: var(--w); }
  .rail-item .t {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .rail-item .d { margin-top: 2px; font-size: 11px; color: var(--w40); }

  .rail-empty { padding: 10px; font-size: 12px; line-height: 1.5; color: var(--w40); }

  .asset {
    display: block;
    padding: 9px 10px;
    margin-bottom: 4px;
    border: 1px solid var(--w08);
    border-radius: 9px;
    color: var(--w80);
    text-decoration: none;
    font-size: 12.5px;
    line-height: 1.35;
  }
  .asset:hover { border-color: var(--w20); color: var(--w); }
  .asset .n { overflow-wrap: anywhere; }
  .asset .m { margin-top: 3px; font-size: 11px; color: var(--w40); }
  .asset .m a { color: var(--cyan); }
  .asset-group {
    margin: 6px 0 4px;
    padding: 0 10px;
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--w40);
  }
  /* Only on a generated file, and only when it is not for a customer. */
  .asset .warn { color: var(--orange); }

  /* Below this the conversation needs the whole width more than the rails
     need to exist. */
  @media (max-width: 1000px) {
    #pane-chat { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
  }


  #assistant { min-width: 0; min-height: 0; }

  /* The widget draws its own header inside an inline mount; here the app
     header already names the tool, so drop the duplicate chrome and let the
     conversation have the space. */
  #assistant .vk-panel { border: none; border-radius: 0; }
  #assistant .vk-header { display: none; }
  #assistant .vk-log { padding: clamp(16px, 3vw, 32px) clamp(16px, 6vw, 15%); gap: 18px; }
  #assistant .vk-msg { max-width: 82ch; font-size: 15px; }
  #assistant .vk-composer { padding: 12px clamp(16px, 6vw, 15%) 8px; }
  #assistant .vk-foot { padding-bottom: 12px; }
  #assistant .vk-empty { max-width: 62ch; }

  /* ── Collateral pane ────────────────────────────────────── */

  .col-bar {
    flex: 0 0 auto; display: flex; gap: 10px; align-items: center;
    padding: 14px clamp(16px, 4vw, 40px);
    border-bottom: 1px solid var(--w08);
  }

  .col-search {
    flex: 1 1 auto; max-width: 620px; padding: 9px 13px;
    border: 1px solid var(--w08); border-radius: 9px;
    background: var(--sf); color: var(--w);
    font-family: inherit; font-size: 14px;
  }
  .col-search::placeholder { color: var(--w40); }
  .col-search:focus { outline: none; border-color: rgba(0,212,255,.45); }

  .col-count { font-family: var(--mono); font-size: 10.5px; color: var(--w40); white-space: nowrap; }

  .col-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 8px clamp(16px, 4vw, 40px) 48px;
    scrollbar-width: thin; scrollbar-color: var(--w20) transparent;
  }
  .col-list::-webkit-scrollbar { width: 8px; }
  .col-list::-webkit-scrollbar-thumb { background: var(--w20); border-radius: 100px; }

  .doc {
    display: block; text-decoration: none; color: inherit;
    padding: 16px 0; border-bottom: 1px solid var(--w08);
  }
  .doc:hover .doc-name { color: var(--cyan); }
  .doc-name { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; transition: color .2s; }
  .doc-summary {
    font-size: 13px; line-height: 1.6; color: var(--w60); max-width: 88ch;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .doc-meta {
    margin-top: 7px; font-family: var(--mono); font-size: 10.5px;
    color: var(--w40); display: flex; gap: 14px; flex-wrap: wrap;
  }

  .kind {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-family: var(--mono); font-size: 9.5px; font-weight: 500;
    letter-spacing: .6px; text-transform: uppercase;
  }
  .kind-pptx { background: rgba(255,122,69,.12); color: var(--orange); }
  .kind-docx { background: rgba(0,212,255,.12); color: var(--cyan); }
  .kind-pdf  { background: rgba(255,90,90,.12); color: #ff5a5a; }
  .kind-other{ background: var(--w08); color: var(--w60); }

  .state { padding: 56px 0; text-align: center; color: var(--w40); font-size: 13.5px; line-height: 1.7; }
  .state b { display: block; color: var(--w60); font-weight: 500; margin-bottom: 6px; }

  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .001ms !important; } }

  @media (max-width: 640px) {
    header { gap: 10px; }
    .logo-t { display: none; }
    .who { display: none; }
    #assistant .vk-log { padding-left: 16px; padding-right: 16px; }
    #assistant .vk-composer { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-m" aria-hidden="true">V</div>
    <div class="logo-t">VIKAT<i>.AI</i></div>
  </div>

  <nav role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-chat" aria-controls="pane-chat" aria-selected="true">Chat</button>
    <button class="tab" role="tab" id="tab-collateral" aria-controls="pane-collateral" aria-selected="false">Collateral</button>
  </nav>

  <div class="who" id="who">Internal · logged</div>
</header>

<main>
  <section class="pane" id="pane-chat" role="tabpanel" aria-labelledby="tab-chat">
    <aside class="rail rail-l" id="rail-chats">
      <div class="rail-head">
        <button type="button" class="rail-tog" id="chats-tog" aria-expanded="true" aria-controls="chats-body"
                title="Hide conversations">
          <span class="rail-chev" aria-hidden="true"></span>
          <span class="rail-name">Chats</span>
        </button>
        <button type="button" class="rail-act" id="chats-new" title="Start a new conversation">New</button>
      </div>
      <div class="rail-body" id="chats-body">
        <div class="rail-empty">Loading…</div>
      </div>
    </aside>

    <div id="assistant"></div>

    <aside class="rail rail-r" id="rail-assets">
      <div class="rail-head">
        <button type="button" class="rail-tog" id="assets-tog" aria-expanded="true" aria-controls="assets-body"
                title="Hide assets">
          <span class="rail-chev" aria-hidden="true"></span>
          <span class="rail-name">Assets</span>
        </button>
        <span class="rail-count" id="assets-count"></span>
      </div>
      <div class="rail-body" id="assets-body">
        <div class="rail-empty">Documents built and collateral found in this conversation collect here.</div>
      </div>
    </aside>
  </section>

  <section class="pane" id="pane-collateral" role="tabpanel" aria-labelledby="tab-collateral" hidden>
    <div class="col-bar">
      <input type="search" class="col-search" id="col-search"
             placeholder="Search decks, one-pagers, documents…"
             aria-label="Search collateral" autocomplete="off">
      <span class="col-count" id="col-count"></span>
    </div>
    <div class="col-list" id="col-list">
      <div class="state">Loading…</div>
    </div>
  </section>
</main>

<script src="./vikat-chat.js"
        data-endpoint="/"
        data-mode="inline"
        data-mount="#assistant"
        defer></script>
<!-- After vikat-chat.js: deferred scripts run in document order, and the
     rails boot against window.VikatChat. -->
<script src="./vikat-rails.js" defer></script>
<script src="./vikat-collateral.js" data-endpoint="/" defer></script>

</body>
</html>
