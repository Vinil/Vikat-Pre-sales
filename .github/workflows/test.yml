# Tests, on every push and pull request.
#
# Exists so the GitHub UI shows a green check before you merge, rather than
# requiring a terminal to know whether the branch is sound.

name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm --prefix scripts install --no-audit --no-fund
          npm --prefix worker install --no-audit --no-fund

      # Build the Worker the way the deploy does.
      #
      # `npm test` never invokes wrangler: test/ttf-loader.mjs registers its
      # own Node hook for the binary imports and has no opinion about
      # wrangler.toml. So a module rule that shadowed another one passed 692
      # tests and failed every deploy at the bundler, and the only signal was
      # a red Deploy run someone had to launch by hand.
      #
      # --dry-run authenticates with nothing and uploads nothing. It is the
      # same esbuild pass the deploy runs, which is the point.
      - name: Build (dry run, same bundler as the deploy)
        working-directory: worker
        run: npx wrangler deploy --env= --dry-run --outdir /tmp/build-check

      # The widget tests need a real browser. They skip cleanly without one, so
      # installing it here is the difference between covering renderBody's XSS
      # behaviour and silently not covering it.
      - name: Install Chromium for the widget tests
        working-directory: worker
        run: npx playwright install --with-deps chromium

      - name: Worker tests
        run: npm --prefix worker test

      - name: Script tests
        run: npm --prefix scripts test

      # The abstraction and public-repo guards live in the worker suite, but
      # call them out so a failure here is legible in the checks list.
      - name: Guards
        run: npm --prefix worker run check:abstractions
